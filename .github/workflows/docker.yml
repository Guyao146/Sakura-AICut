# =============================================================================
# Sakura AI Cut —— 镜像自动构建并发布到 GitHub Container Registry (ghcr.io)
#
# 触发条件：
#   1. 推送到 main / master 分支
#   2. 发布 Release（打 v* 标签）—— 同时打 stable 与版本号标签
#   3. 手动触发（workflow_dispatch）
#
# 产物：ghcr.io/guyao146/sakura-aicut-web / sakura-aicut-worker
# =============================================================================
name: Build & Publish Docker Images

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/docker.yml'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            dockerfile: docker/Dockerfile.web
            image: ghcr.io/guyao146/sakura-aicut-web
          - target: worker
            dockerfile: docker/Dockerfile.worker
            image: ghcr.io/guyao146/sakura-aicut-worker

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取版本标签
        id: meta
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${GITHUB_SHA:0:7}"
            if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
              echo "$IMAGE:stable"
              echo "$IMAGE:${GITHUB_REF_NAME#v}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 构建并发布 ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false

      - name: 验证镜像启动
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          image="$IMAGE:sha-${GITHUB_SHA:0:7}"
          name="sakura-smoke-$TARGET"
          trap 'docker logs "$name"; docker rm -fv "$name" >/dev/null' EXIT
          docker pull --platform linux/amd64 "$image"
          docker run -d --platform linux/amd64 --name "$name" "$image"
          for attempt in $(seq 1 40); do
            if [[ "$TARGET" == "web" ]]; then
              if docker exec "$name" node -e "fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then
                docker exec "$name" node -e "fetch('http://127.0.0.1:3000/api/jobs',{redirect:'manual'}).then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"
                exit 0
              fi
            elif docker logs "$name" 2>&1 | grep -q 'Worker 已启动'; then
              test "$(docker inspect -f '{{.State.Running}}' "$name")" = true
              exit 0
            fi
            sleep 3
          done
          echo '镜像启动检查超时'
          exit 1
